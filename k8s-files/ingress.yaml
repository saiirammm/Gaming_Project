apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web-project-ingress
  annotations:
    kubernetes.io/ingress.class: azure/application-gateway
    appgw.ingress.kubernetes.io/backend-path-prefix: "/"
spec:
  rules:
  - http:
      paths:
      - path: /webapp
        pathType: Prefix
        backend:
          service:
            name: myapp
            port:
              number: 80
