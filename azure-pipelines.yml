apiVersion: v1
kind: Pod
metadata:
  name: sairam-app-pod
  labels:
    app: sairam-app
spec:
  containers:
  - name: sairam-container
    image: tryimage.azurecr.io/newimage:latest
    ports:
    - containerPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sairam-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sairam-app
  template:
    metadata:
      labels:
        app: sairam-app
    spec:
      containers:
      - name: sairam-container
        image: tryimage.azurecr.io/newimage:latest
        ports:
        - containerPort: 80
